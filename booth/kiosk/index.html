<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Furhat Photo Booth</title>
<style>
  :root { --bg: #111; --ink: #fff; --soft: #bbb; --accent: #ff7a3d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; overflow: hidden; cursor: none; }
  #stage { position: fixed; inset: 0; }
  video, #shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  video { transform: scaleX(-1); } /* mirror the preview like a selfie camera; the saved photo is not mirrored */
  #shot { display: none; }
  .overlay { position: absolute; left: 0; right: 0; text-align: center; text-shadow: 0 2px 12px rgba(0,0,0,.7); }
  #prompt { bottom: 6vh; font-size: 5vh; font-weight: 700; }
  #prompt kbd { background: var(--accent); color: #111; border-radius: 1vh; padding: .2em .6em; text-shadow: none; }
  #count { top: 50%; transform: translateY(-50%); font-size: 40vh; font-weight: 800; display: none; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .4s; }
  #qr { position: absolute; inset: 0; display: none; background: var(--bg);
    flex-direction: column; align-items: center; justify-content: center; gap: 3vh; text-align: center; }
  #qr .code { background: #fff; padding: 2vh; border-radius: 2vh; }
  #qr .code svg { width: 45vh; height: 45vh; display: block; }
  #qr h1 { font-size: 5vh; margin: 0; }
  #qr p { font-size: 2.6vh; color: var(--soft); margin: 0; }
  #message { top: 45%; font-size: 4vh; display: none; padding: 0 5vw; }
  #status { position: absolute; top: 1.5vh; right: 1.5vh; width: 1.4vh; height: 1.4vh; border-radius: 50%; background: #c33; }
  #status.ok { background: #3a3; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <img id="shot" alt="">
  <div id="prompt" class="overlay">Press <kbd>SPACE</kbd> to take a photo with Furhat</div>
  <div id="count" class="overlay"></div>
  <div id="message" class="overlay"></div>
  <div id="flash"></div>
  <div id="qr">
    <div class="code" id="qrcode"></div>
    <h1>Scan to get your photo</h1>
    <p>Answer a short survey on your phone, then download your photo.</p>
    <p>Press SPACE when you are done</p>
  </div>
  <div id="status" title="connection to the booth orchestrator"></div>
</div>
<script>
// Kiosk states: live -> countdown -> preview -> qr -> live.
// The orchestrator starts the countdown (so Furhat's photo line starts at the same moment);
// this page captures the frame, posts it to the orchestrator and shows the returned QR code.
const PREVIEW_MS = 3000;
const QR_TIMEOUT_MS = 60000;

const $ = (id) => document.getElementById(id);
const video = $('video');
let state = 'live';
let ws = null;
let qrTimer = null;

function setState(next) {
  state = next;
  $('prompt').style.display = next === 'live' ? 'block' : 'none';
  $('count').style.display = next === 'countdown' ? 'block' : 'none';
  $('shot').style.display = next === 'preview' ? 'block' : 'none';
  $('qr').style.display = next === 'qr' ? 'flex' : 'none';
  $('message').style.display = next === 'error' ? 'block' : 'none';
}

function showError(text, then) {
  $('message').textContent = text;
  setState('error');
  if (then) setTimeout(then, 3000);
}

async function startCamera() {
  try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false,
    });
  } catch (e) {
    showError('Camera not available. Allow camera access for this page and reload.');
  }
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => $('status').classList.add('ok');
  ws.onclose = () => { $('status').classList.remove('ok'); setTimeout(connect, 2000); };
  ws.onmessage = (msg) => {
    const event = JSON.parse(msg.data);
    if (event.type === 'countdown') countdown(event.seconds);
  };
}

function send(event) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(event));
}

async function countdown(seconds) {
  setState('countdown');
  for (let n = seconds; n > 0; n--) {
    $('count').textContent = n;
    await new Promise((r) => setTimeout(r, 1000));
  }
  await capture();
}

async function capture() {
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  $('flash').style.transition = 'none';
  $('flash').style.opacity = 1;
  requestAnimationFrame(() => { $('flash').style.transition = 'opacity .4s'; $('flash').style.opacity = 0; });

  const blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.9));
  $('shot').src = URL.createObjectURL(blob);
  setState('preview');
  try {
    const res = await fetch('/capture', { method: 'POST', body: blob, headers: { 'content-type': 'image/jpeg' } });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const { qr_svg } = await res.json();
    $('qrcode').innerHTML = qr_svg;
  } catch (e) {
    showError('Something went wrong. Please try again.', reset);
    return;
  }
  setTimeout(() => {
    if (state !== 'preview') return;
    setState('qr');
    qrTimer = setTimeout(reset, QR_TIMEOUT_MS);
  }, PREVIEW_MS);
}

function reset() {
  clearTimeout(qrTimer);
  URL.revokeObjectURL($('shot').src);
  setState('live');
  send({ type: 'reset' });
}

document.addEventListener('keydown', (e) => {
  if (e.code !== 'Space' || e.repeat) return;
  e.preventDefault();
  if (state === 'live') {
    if (!ws || ws.readyState !== WebSocket.OPEN) return showError('Reconnecting to the booth…', reset);
    send({ type: 'photo_requested' });
  } else if (state === 'qr') {
    reset();
  }
});

setState('live');
startCamera();
connect();
</script>
</body>
</html>
